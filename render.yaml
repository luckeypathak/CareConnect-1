services:
  - type: web
    name: careconnect-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn careconnect_core.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: careconnect-db
          property: connectionString
    autoDeploy: true

databases:
  - name: careconnect-db
    databaseName: careconnect_db
    user: careconnect_user
    plan: free
